<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07080e"/>
      <stop offset="50%" stop-color="#0f111d"/>
      <stop offset="100%" stop-color="#06070c"/>
    </linearGradient>
    <linearGradient id="solanaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9945FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14F195" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="280" fill="url(#accentGlow)" filter="url(#blurFilter)"/>
  <circle cx="1000" cy="480" r="240" fill="#14F195" fill-opacity="0.15" filter="url(#blurFilter)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Main Card Container -->
  <rect x="80" y="80" width="1040" height="470" rx="28" fill="#101322" fill-opacity="0.75" stroke="#9945FF" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Top Badge: MLH Solana Hackathon 2026 -->
  <rect x="130" y="130" width="340" height="42" rx="21" fill="#9945FF" fill-opacity="0.15" stroke="#9945FF" stroke-opacity="0.4"/>
  <circle cx="155" cy="151" r="5" fill="#14F195"/>
  <text x="175" y="157" fill="#14F195" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="1">SOLANA HACKATHON 2026 OFFICIAL ENTRY</text>

  <!-- Project Title -->
  <text x="130" y="240" fill="url(#solanaGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" letter-spacing="-1">SOLANA NEUROSHIELD AI</text>

  <!-- Subtitle -->
  <text x="130" y="295" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="24">Autonomous AI Pre-Execution Firewall &amp; Instant Micro-Payment Stream</text>
  <text x="130" y="335" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18">Sub-400ms transaction simulation, drainer honeypot prevention, and NLP agent execution.</text>

  <!-- Divider -->
  <line x1="130" y1="385" x2="1070" y2="385" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Author & Attribution Section -->
  <g transform="translate(130, 420)">
    <!-- Shield Icon -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#9945FF" fill-opacity="0.2" stroke="#9945FF" stroke-opacity="0.4"/>
    <text x="18" y="37" font-size="26">🛡️</text>

    <!-- Author Details -->
    <text x="75" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13" letter-spacing="1.5">LEAD ARCHITECT &amp; CREATOR</text>
    <text x="75" y="48" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24">Suraj Dhawal <tspan fill="#14F195" font-weight="600" font-size="18">(@Dev-Suraj-Dhawal)</tspan></text>

    <!-- Live Demo Pill (Right Side) -->
    <g transform="translate(680, 5)">
      <rect x="0" y="0" width="260" height="46" rx="12" fill="#14F195" fill-opacity="0.15" stroke="#14F195" stroke-opacity="0.5"/>
      <text x="30" y="28" fill="#14F195" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15">⚡ Live on GitHub Pages</text>
    </g>
  </g>
</svg>
